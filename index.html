<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi amor ❤️</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffe6f0;
            color: #5a2942;
            text-align: center;
        }

        .pantalla {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            line-height: 1.5;
        }

        button {
            border: none;
            border-radius: 25px;
            padding: 15px 25px;
            margin: 10px;
            font-size: 17px;
            cursor: pointer;
            background: #ff6f9f;
            color: white;
        }

        button:hover {
            transform: scale(1.05);
        }

        .oculto {
            display: none;
        }

        .corazon {
            font-size: 70px;
            animation: latido 1.2s infinite;
        }

        @keyframes latido {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }
    </style>
</head>

    <div id="inicio" class="pantalla">
